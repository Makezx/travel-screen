spring:
  application:
    name: travel-screen
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8388}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
    session:
      cookie:
        http-only: true
        same-site: lax

# 应用自定义配置（对所有 profile 生效）
# ⚠️ 以下默认账号/密码仅用于本地演示，开源后请务必通过环境变量覆盖，并在首次启动后立即修改！
app:
  auth-file: ${AUTH_FILE:./travel-auth.json}
  secret-file: ${SECRET_FILE:./travel-secret.key}
  admin-user: ${ADMIN_USER:admin}
  admin-pass: ${ADMIN_PASS:admin123}
  session-hours: ${SESSION_HOURS:12}
  default-user-pass: ${DEFAULT_USER_PASS:user123}
  # ── 外部 API ①：AI 行程规划 / 照片识别（智谱 GLM，OpenAI 兼容协议）──
  # 换厂商只改 base-url + model + api-key，调用方 AiPlanService 不用动。
  # 完整清单见仓库根目录 EXTERNAL-APIS.md
  ai:
    enabled: ${AI_ENABLED:true}
    # OpenAI 兼容的 chat/completions 端点；换 DeepSeek/Kimi/通义等改这一行即可
    base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:glm-4-air}
    vision-model: ${AI_VISION_MODEL:glm-4.6v}
    timeout-ms: ${AI_TIMEOUT_MS:60000}
    # ── 限流（AiRateLimiter）：生产挂真实付费 Key 且 demo 账号公开，必须防刷 ──
    # 按「单 IP」与「单用户」双维度计数，任一超限即拒
    rate-per-minute: ${AI_RATE_PER_MINUTE:5}
    rate-per-day: ${AI_RATE_PER_DAY:100}
    # 同时并发上限（同步 HTTP 调用很慢，不设会把 Tomcat 线程池打满）
    max-concurrency: ${AI_MAX_CONCURRENCY:2}
    # 抢不到并发槽位时的排队等待，超时快速失败而不是堆积
    queue-timeout-ms: ${AI_QUEUE_TIMEOUT_MS:3000}
  # ── 外部 API ②：路线烘焙（大屏详细路径地图）────────────────────────
  # 完整清单见仓库根目录 EXTERNAL-APIS.md
  route:
    # straight | osrm | amap —— osrm 免 Key；amap 中国路网最佳，需 amap-key
    provider: ${ROUTE_PROVIDER:straight}
    amap-key: ${ROUTE_AMAP_KEY:}
    # HTTP 超时
    connect-timeout-ms: ${ROUTE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ROUTE_READ_TIMEOUT_MS:5000}
    # 限流：高德官方 ≤3 QPS，段间停顿 400ms ≈ 2.5 QPS 留余量
    amap-segment-delay-ms: ${ROUTE_AMAP_SEGMENT_DELAY_MS:400}
    amap-max-tries: ${ROUTE_AMAP_MAX_TRIES:5}
    # 路径抽稀容差（度），默认 0.006° ≈ 700m，越大点越少
    simplify-tol: ${ROUTE_SIMPLIFY_TOL:0.006}
    # 启动回填时行程之间的停顿；设 0 可完全不限速
    backfill-delay-ms: ${ROUTE_BACKFILL_DELAY_MS:400}
  photo-dir: ${PHOTO_DIR:./photos}

# 本地默认：H2 文件库，零运维，可直接 java -jar 跑起来
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./traveldb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

# 生产：MySQL（需设置下面三个环境变量；不设置则回退到 local 的 H2 文件库）
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/travel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:travel}
    password: ${DB_PASS:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
