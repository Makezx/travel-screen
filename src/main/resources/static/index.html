var SEQ=[];
var PJ={minx:0,maxx:1,miny:0,maxy:1,W:1000,H:820};
function mercX(lng){return lng*Math.PI/180;}
function mercY(lat){return -Math.log(Math.tan((90+lat)*Math.PI/360));}
function initProj(){
  var xs=[],ys=[],i,j,r;
  for(i=0;i<GEO.provinces.length;i++)for(j=0;j<GEO.provinces[i].p.length;j++){r=GEO.provinces[i].p[j];
    for(var k=0;k<r.length;k++){xs.push(mercX(r[k][0]));ys.push(mercY(r[k][1]));}}
  PJ.minx=Math.min.apply(null,xs);PJ.maxx=Math.max.apply(null,xs);PJ.miny=Math.min.apply(null,ys);PJ.maxy=Math.max.apply(null,ys);
  var ratio=(PJ.maxy-PJ.miny)/(PJ.maxx-PJ.minx);PJ.W=1000;PJ.H=Math.round(1000*ratio);
}
function PX(lng){return (mercX(lng)-PJ.minx)/(PJ.maxx-PJ.minx)*PJ.W;}
function PY(lat){return (mercY(lat)-PJ.miny)/(PJ.maxy-PJ.miny)*PJ.H;}
function ringPath(r){var d='',i;for(i=0;i<r.length;i++)d+=(i?'L':'M')+PX(r[i][0]).toFixed(1)+' '+PY(r[i][1]).toFixed(1);return d+'Z';}
function polyPath(polys){var d='',i;for(i=0;i<polys.length;i++)d+=ringPath(polys[i]);return d;}

var _lblCell=null;

/* 底图：独立端点 + 客户端缓存。
   底图与行程/团队无关（369 个地级市，约 1MB），以前每次 /api/screen-data 都整包重传，
   切一次活动就多拉约 1MB。现在首次真正下载，之后命中内存缓存（并由 /api/geo 的
   Cache-Control 让浏览器也缓存一天）。 */
var GEO_P=null,GEO_C=null;
function loadGeo(){
  if(GEO_C)return Promise.resolve(GEO_C);
  if(!GEO_P){
    GEO_P=fetch('/api/geo').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(g){GEO_C=g;return g;});
  }
  return GEO_P;
}

  GEO=d.geo||g; // 兼容：若载荷仍自带 geo 则优先用它，否则用 /api/geo
  initProj();buildBase();
  SEQ=TRIPS.filter(function(t){return t.status==='done'&&(t.path||[]).length>1;});if(!SEQ.length)SEQ=TRIPS.slice();
  S.sel=null;S.drawer=false;S.allLit=false;S.allRoutes=true;S.lgOpen=false;

/* ==================== 3D 地图（ECharts GL）+ 城市照片墙 ==================== */
// 地图边界数据：阿里云 DataV GeoAtlas 100000_full（含台湾及南海诸岛）
// 降级策略：echarts / echarts-gl / china.json 任一加载失败、window.echarts 未定义、
// 或 getContext('webgl') 不可用时，完整回退到上方原有 SVG 地图渲染（原逻辑零改动）。
var GL={ready:false,loading:false,failed:false,mode:'2d',pending3d:false,chart:null,coords:null};
var PHOTOS=null; // null=照片墙功能未启用；数组=payload.photos [{city,fileName,caption,url}]

function webglOK(){
  try{var c=document.createElement('canvas');
    return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));
  }catch(e){return false;}
}
function loadScript(src,cb){
  var s=document.createElement('script');s.src=src;s.async=true;
  s.onload=function(){cb(null);};
  s.onerror=function(){cb(new Error('脚本加载失败：'+src));};
  document.head.appendChild(s);
}
function loadLocalJSON(src,cb){
  fetch(src).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){cb(null,j);}).catch(function(e){cb(e);});
}
function tripById(id){for(var i=0;i<TRIPS.length;i++)if(TRIPS[i].id===id)return TRIPS[i];return null;}
function coordOf(nm){
  if(!GL.coords||!nm)return null;
  if(GL.coords[nm])return GL.coords[nm];
  return GL.coords[nm+'市']||null;
}
/* --- vendor 资源按需动态加载（不阻塞首屏；就绪前保持 2D SVG）--- */
function init3DOnce(){
  if(GL.ready||GL.failed||GL.loading)return;
  GL.loading=true;
  loadChinaThenCoords(function(e3,cn){
    if(e3||!cn||!cn.features||!cn.features.length){glFail('地图边界数据加载失败');return;}
    loadLocalJSON('/vendor/city-coords.json',function(e4,cc){
      if(e4)cc={}; // 坐标表缺失不致命：不画光柱，地图仍可用
      GL.coords=cc||{};
      try{echarts.registerMap('china',cn);GL.loading=false;GL.ready=true;}
      catch(e5){glFail('地图注册失败');return;}
      if(GL.pending3d){GL.pending3d=false;GL.mode='3d';localStorage.setItem('screenMapMode','3d');applyMapMode();}
    });
  });
  function ensureEcharts(done){
    if(typeof window.echarts!=='undefined')return done(null);
    loadScript('/vendor/echarts.min.js',function(e){
      if(e||typeof window.echarts==='undefined')return done(new Error('echarts 加载失败'));
      loadScript('/vendor/echarts-gl.min.js',function(e2){
        if(e2)return done(new Error('echarts-gl 加载失败'));
        done(null);
      });
    });
  }
  function loadChinaThenCoords(done){
    ensureEcharts(function(err){
      if(err){glFail(err.message);return;}
      loadLocalJSON('/vendor/china.json',function(e3,cn){done(e3,cn);});
    });
  }
}
function glFail(msg){
  var wasPending=GL.pending3d;
  GL.loading=false;GL.failed=true;GL.pending3d=false;
  var b=$('btnMap3d');if(b)b.style.display='none'; // 3D 不可用即隐藏切换按钮
  if(GL.mode==='3d'){GL.mode='2d';applyMapMode();}
  if(wasPending||GL.mode==='3d')toast2(msg+'，已回退 2D 地图');
}
/* --- 2D / 3D 模式切换 --- */
function applyMapMode(){

  applyLegend();
  if(is3)render3D();else dispose3D(); // 切 2D 时 dispose 即停止自动旋转
}
function setMapMode(m){
  if(m==='3d'){
    if(GL.failed||!webglOK()){toast2('当前环境不支持 3D 地图，已使用 2D');return;}
    if(!GL.ready){GL.pending3d=true;init3DOnce();toast2('3D 地图资源加载中…');return;}
    GL.mode='3d';
  }else{GL.mode='2d';GL.pending3d=false;}
  localStorage.setItem('screenMapMode',GL.mode);

function bootMapMode(){
  var b=$('btnMap3d');if(!b)return;
  b.onclick=function(){setMapMode(GL.mode==='3d'?'2d':'3d');};
  // 默认 3D（WebGL 可用时）。注意：启动瞬间 GPU 适配器可能尚未就绪导致首次探测失败，
  // 故探测失败时延迟 2 秒重试一次，仍不可用则停留在 2D（用户可稍后手动切换）。
  if(localStorage.getItem('screenMapMode')!=='2d'){
    if(webglOK())setMapMode('3d');
    else setTimeout(function(){
      if(GL.mode==='2d'&&!GL.failed&&localStorage.getItem('screenMapMode')!=='2d'&&webglOK())setMapMode('3d');
    },2000);
  }
  window.addEventListener('resize',syncMap3dSize);
}
function syncMap3dSize(){
  var box=$('map3d');if(!box)return;
  var svg=$('mapsvg');
  var w=svg.clientWidth||(svg.parentNode?svg.parentNode.clientWidth:0)||800;
  var h=Math.round(w*PJ.H/Math.max(1,PJ.W)); // 沿用 SVG 视口比例，保证卡片不塌陷
  h=Math.max(320,h);

  var mc=box.closest?box.closest('.mapcard'):null;

  if(GL.chart)GL.chart.resize();
}
/* --- 3D 渲染 --- */
function render3D(){
  if(!GL.ready||GL.mode!=='3d')return;
  if(!webglOK()){glFail('WebGL 不可用');return;}
  syncMap3dSize();
  dispose3D();
  try{GL.chart=echarts.init($('map3d'),null,{renderer:'canvas'});GL.chart.setOption(build3dOption());}
  catch(e){dispose3D();glFail('3D 渲染失败');return;}
  bind3dEvents();
}
function dispose3D(){if(GL.chart){try{GL.chart.dispose();}catch(e){}GL.chart=null;}}
// 城市光柱数据：聚合每个城市分摊花费（LIT 由 screen-data 提供，v=到访次数 s=分摊花费）
function cityPillars(){
  var arr=[],seen={},a,st,nm,xy;
  for(a in LIT){
    if(!LIT.hasOwnProperty(a))continue;st=LIT[a];
    if(!st||!st.n)continue;
    nm=st.sn||shortC(st.n);if(seen[nm])continue;
    xy=coordOf(nm);if(!xy)continue; // 查不到坐标的城市：不画光柱、不报错
    seen[nm]=1;
    arr.push({name:nm,lng:xy[0],lat:xy[1],spend:Number(st.s)||0,visits:st.v||1});
  }
  return arr;
}
// 3D 路线数据：「全部路线」展示全部已完成行程；「单程路线」且选中某行程时只展示该行程（无选中则不画线）。
// 给每个坐标加一个海拔 ALT，让飞线浮在地图地形之上，避免被 regionHeight 埋住而不明显。
var ROUTE_ALT=6;
function route3dData(){
  var arr=[],di;
  // 单程模式：只画选中的行程；未选中则不画（与 2D 行为一致）
  var single=null;
  if(!S.allRoutes){
    if(S.sel){
      for(var si=0;si<TRIPS.length;si++)if(TRIPS[si].id===S.sel){single=TRIPS[si];break;}
      if(!single||!single.path||single.path.length<=1)single=null;
    }
    if(!single)return arr; // 单程模式且无有效选中：不画任何线
  }
  for(di=0;di<TRIPS.length;di++){
    var tr=TRIPS[di];if(!tr)continue;
    if(!single && tr.status!=='done')continue; // 全部模式下只取已完成
    if(single && tr.id!==single.id)continue;  // 单程模式只取选中，不卡完成状态
    if(!((tr.path||[]).length>1))continue;
    var cc=[];
    for(var i=0;i<tr.path.length;i++)cc.push([Number(tr.path[i][0])||0,Number(tr.path[i][1])||0,ROUTE_ALT]);
    var sel=(tr.id===S.sel);
    arr.push({coords:cc, lineStyle:{color:routeColor(di), width:sel?6:3.2, opacity:sel?1:0.82}});
  }
  return arr;
}
function build3dOption(){
  var ps=cityPillars(),mx=0,i;
  for(i=0;i<ps.length;i++)if(ps[i].spend>mx)mx=ps[i].spend;
  function ratio(s){return mx>0?Math.sqrt(Math.max(0,s)/mx):0;}
  function sz(s){return 6+ratio(s)*20;}          // 光柱大小 ∝ √金额
  function col(s){return brightColor(Math.min(9,1+8*ratio(s)));}
  var core=[],halo=[];
  for(i=0;i<ps.length;i++){
    var c=col(ps[i].spend),v=[ps[i].lng,ps[i].lat,ps[i].spend];
    core.push({name:ps[i].name,visits:ps[i].visits,spend:ps[i].spend,value:v,
      itemStyle:{color:c,opacity:.95},symbolSize:sz(ps[i].spend)});
    halo.push({name:ps[i].name,value:v,itemStyle:{color:c,opacity:.16},symbolSize:sz(ps[i].spend)*2.6}); // 光晕层
  }
  var routes3d=route3dData();
  var csst=getComputedStyle(document.documentElement),landColor=(csst.getPropertyValue('--land').trim()||'#241c4d'),landLineColor=(csst.getPropertyValue('--landline').trim()||'#5a48a8'),empColor=(csst.getPropertyValue('--purple').trim()||'#7a4fd0'),empLineColor=(csst.getPropertyValue('--line2').trim()||'#c9a8ff');
  return {
    backgroundColor:'transparent',
    geo3D:{
      map:'china',                     // 完整边界渲染：含台湾及南海诸岛，不做任何隐藏/裁剪
      regionHeight:2.2,boxWidth:100,shading:'lambert',
      itemStyle:{color:landColor,borderColor:landLineColor,borderWidth:1,opacity:1},
      emphasis:{itemStyle:{color:empColor,borderColor:empLineColor,borderWidth:1.4},label:{show:false}},
      label:{show:false},
      light:{main:{intensity:1.15,shadow:true,alpha:42,beta:26},ambient:{intensity:.55}},
      viewControl:{autoRotate:true,autoRotateSpeed:3,autoRotateAfterStill:2, // 缓慢自动旋转
        distance:95,alpha:52,beta:4,rotateSensitivity:1,panSensitivity:1,zoomSensitivity:1,
        damping:.82,animation:true,animationDurationUpdate:800},
      postEffect:{enable:true,bloom:{enable:true,bloomIntensity:.18}},
      groundPlane:{show:false}
    },
    series:[
      {id:'halo',name:'halo',type:'scatter3D',coordinateSystem:'geo3D',data:halo,silent:true},
      {id:'core',name:'core',type:'scatter3D',coordinateSystem:'geo3D',data:core,
        label:{show:true,position:'top',formatter:function(p){return p.name;},
          textStyle:{color:'#f3ecff',fontSize:11,backgroundColor:'rgba(11,10,31,.5)',padding:[2,5],borderRadius:3}}},
      {id:'sellineGlow',name:'sellineGlow',type:'lines3D',coordinateSystem:'geo3D',data:routes3d,polyline:true,silent:true,
        lineStyle:{width:8,color:'#9b6bff',opacity:.18},
        effect:{show:false}},
      {id:'selline',name:'selline',type:'lines3D',coordinateSystem:'geo3D',data:routes3d,polyline:true,silent:true,
        lineStyle:{width:3.2,color:'#9b6bff',opacity:.85},
        effect:{show:routes3d.length>0,period:3.5,trailWidth:4.5,trailLength:.5,trailColor:'#fff3b0',trailOpacity:.98}}
    ]
  };
}
function update3dSelection(){
  if(!GL.chart)return;
  // 重绘全部路线（route3dData 已按 S.sel 决定哪条加粗高亮），而非退回单条线
  var routes3d=route3dData();
  try{GL.chart.setOption({series:[
    {id:'sellineGlow',data:routes3d},
    {id:'selline',data:routes3d,effect:{show:routes3d.length>0}}
  ]});}catch(e){}
}
function bind3dEvents(){
  if(!GL.chart)return;
  GL.chart.on('click',function(p){
    if(!p)return;
    if(p.seriesType==='scatter3D'&&p.data&&p.data.name){openPhotoWall(p.data.name,true);return;} // 光柱点击→照片墙
    if(p.componentType==='geo3D'&&p.name)openPhotoWall(shortC(p.name),false); // 省份点击：有照片才弹
  });
}
/* --- 城市照片墙 --- */
function buildPhotoIndex(){
  PHOTOS=(D&&Array.isArray(D.photos))?D.photos:null; // photos 字段缺失：整体静默不启用
}
function findPhotos(city){
  var out=[],i,cShort=shortC(city);
  if(!PHOTOS)return out;
  for(i=0;i<PHOTOS.length;i++){
    var p=PHOTOS[i];if(!p||!p.url)continue;
    // 命中①：照片自身城市；命中②：所属行程到访城市（照片 city 为空时也能在地图点开）
    var pc=String(p.city||'');
    if(pc===city||shortC(pc)===cShort){out.push(p);continue;}
    if(Array.isArray(p.cities)){for(var j=0;j<p.cities.length;j++){var cc=String(p.cities[j]||'');if(cc===city||shortC(cc)===cShort){out.push(p);break;}}}
  }
  return out;
}
function showWall(city,list){
  $('pwTitle').textContent=city+' · 足迹照片';
  $('pwCnt').textContent=list.length+' 张';
  var h='';
  for(var i=0;i<list.length;i++){
    var p=list[i];
    h+='<figure class="pw-item"><img loading="lazy" src="'+esc(p.url)+'" alt="'+esc(p.caption||city)+'" onerror="this.style.opacity=.12"/>'
      +'<figcaption class="cap">'+(p.caption?esc(p.caption):'&nbsp;')+'</figcaption></figure>';
  }
  $('pwGrid').innerHTML=h;
  $('pwMask').classList.add('open');
}
function openPhotoWall(city,fromPillar){
  if(!PHOTOS)return;                    // 功能未启用：静默
  var list=findPhotos(city);
  if(!list.length){
    if(fromPillar)toast2('「'+city+'」暂无照片'); // 光柱点击给提示；省份点击静默
    return;
  }
  showWall(city,list);
}
function closePhotoWall(){$('pwMask').classList.remove('open');$('pwGrid').innerHTML='';}
function bind3dChrome(){
  $('pwClose').onclick=closePhotoWall;
  $('pwMask').addEventListener('click',function(e){if(e.target===$('pwMask'))closePhotoWall();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closePhotoWall();});
}
function sync3dAfterData(){
  buildPhotoIndex();
  if(GL.mode==='3d'){if(GL.chart)render3D();else applyMapMode();}
}
// 调试/QA 句柄（不影响业务逻辑；供无头测试与排查用）
window.__screen3d={GL:GL,openPhotoWall:openPhotoWall,closePhotoWall:closePhotoWall,
  setMapMode:setMapMode,webglOK:webglOK,cityPillars:cityPillars,
  setPhotos:function(a){PHOTOS=Array.isArray(a)?a:null;},getPhotos:function(){return PHOTOS;}};

async function init(){
  var remembered=localStorage.getItem('screenTeamId');
  if(remembered&&remembered==='0')remembered=null;
  var rememberedAct=localStorage.getItem('screenActivityId');
  if(rememberedAct&&rememberedAct==='0')rememberedAct=null;
  try{
    var url='/api/screen-data'+(rememberedAct?'?parentId='+rememberedAct:(remembered?'?teamId='+remembered:''));
    var resp=await fetch(url);
    if(resp.status===401){location.href='/login';return;}
    D=await resp.json();
  }catch(e){document.body.innerHTML='<div style="padding:40px;color:#ff5fa2">数据加载失败：'+e+'</div>';return;}
  TRIPS=D.trips;PEOPLE=D.people;LIT=D.lit;ST=D.stat;NEXT=D.nextup;
  S.isMock=!!D.mock;
  try{GEO=D.geo||await loadGeo();}catch(e){document.body.innerHTML='<div style="padding:40px;color:#ff5fa2">底图加载失败：'+e+'</div>';return;}
  initProj();buildBase();
  SEQ=TRIPS.filter(function(t){return t.status==='done'&&(t.path||[]).length>1;});if(!SEQ.length)SEQ=TRIPS.slice();
  bindTop();bindMap();syncPlay();refreshAll();tickClock();applyVisibility();startTourTimer();
  buildPhotoIndex();bind3dChrome();bootMapMode(); // 3D 地图 + 照片墙初始化（WebGL 可用则默认 3D）
  setInterval(tickClock,1000);
  if(!S.isMock){
    loadTeamsForSelect(remembered);
    loadActivitiesForSelect(rememberedAct);
  }
  $('selTeam').onchange=function(){switchTeam(Number(this.value));};
  $('selAct').onchange=function(){switchActivity(this.value);};
  var st=$('setTheme'); if(st){ st.value=getTheme(); st.onchange=function(){ applyTheme(this.value); }; }
  window.addEventListener('themechange',function(){ try{ refreshAll(); }catch(e){} });
}
init();
})();
</script>
