name: Release

# 推 v* 形式的 tag 即发布（例如 v1.0.0、v1.2.3）。
# 也可以在 Actions 页面手动触发，填一个已存在的 tag 名。
#
# 发布说明优先取 release-notes/<tag>.md（人工策展）；
# 找不到就回退到通用说明，并自动附上"完整变更"对比链接。
# 已存在的 release 会被更新而非报错，所以同一个 tag 可以安全重跑。
# 最后一步会校验 release 真的存在，避免出现"步骤成功但没发布"的静默失败。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（需已存在，例如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 生成 release notes 需要完整历史

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "jar=travel-screen-${TAG}.jar" >> "$GITHUB_OUTPUT"
          echo "发布版本：$TAG"

      - name: Run tests
        run: mvn -B --no-transfer-progress clean test

      - name: Package runnable jar
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Rename jar
        run: cp target/travel-screen.jar "${{ steps.ver.outputs.jar }}"

      - name: Smoke check the jar actually boots
        run: |
          # 用 local profile 起一次，确认发布物可运行（不接任何外部依赖）
          java -jar "${{ steps.ver.outputs.jar }}" \
            --server.port=8399 --spring.profiles.active=local > /tmp/boot.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8399/ || true)
            [ "$code" = "200" ] && echo "启动成功（HTTP 200）" && exit 0
            sleep 2
          done
          echo "启动失败，日志尾部："; tail -60 /tmp/boot.log; exit 1

      - name: Compose release notes
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          if [ -f "release-notes/${TAG}.md" ]; then
            cp "release-notes/${TAG}.md" "$NOTES"
            echo "使用策展说明：release-notes/${TAG}.md"
          else
            printf '# %s\n\n详见 [CHANGELOG.md](CHANGELOG.md)。\n' "$TAG" > "$NOTES"
            echo "未找到 release-notes/${TAG}.md，回退到通用说明"
          fi
          # 附上"完整变更"对比链接（首个版本则指向提交列表）
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ]; then
            printf '\n---\n\n**完整变更**：https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV" "$TAG" >> "$NOTES"
          else
            printf '\n---\n\n**全部提交**：https://github.com/%s/commits/%s\n' \
              "$GITHUB_REPOSITORY" "$TAG" >> "$NOTES"
          fi
          echo "----- 生成的发布说明（$NOTES）-----"
          wc -l "$NOTES"
          head -12 "$NOTES"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ steps.ver.outputs.jar }}
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true

      # 手写 gh 脚本曾出现"步骤成功但 release 并不存在"的情况（拿不到日志，无法定位）。
      # 这一层校验把静默成功变成显式失败，避免再发一次空版本。
      - name: Verify the release is actually published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          for i in $(seq 1 10); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "校验通过：release $TAG 已发布"
              gh release view "$TAG" --json tagName,isDraft,isLatest,url,assets \
                --template '{{.tagName}} draft={{.isDraft}} latest={{.isLatest}}{{"\n"}}{{.url}}{{"\n"}}assets: {{range .assets}}{{.name}} ({{.size}}B) {{end}}{{"\n"}}'
              exit 0
            fi
            echo "第 $i 次未见 release，3 秒后重试…"
            sleep 3
          done
          echo "::error::release $TAG 未创建成功——发布流程无效"
          echo "当前 release 列表："
          gh release list || true
          exit 1

      - name: Summary
        run: |
          {
            echo "### 已发布 ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "- 发布物：\`${{ steps.ver.outputs.jar }}\`（可直接 \`java -jar\` 运行）"
            echo "- 页面：https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
