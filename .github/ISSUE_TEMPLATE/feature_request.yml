name: 功能请求
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新功能请先在这里对齐方向，**确认后再动手写 PR**，避免白费功夫。

        这几点是这个项目刻意不做的事，提之前可以先看一下：
        - 不引入前端构建链（没有 npm/webpack/vite，前端就是单文件 HTML）
        - 不引入外部 CDN，所有资源本地内嵌
        - 不接第三方地图服务（不用瓦片、不需要地图 Key）

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景和痛点，不用急着给方案。描述"我现在怎么做很别扭"比"我想要一个 XX 按钮"更有用。
      placeholder: 我一年要规划十几次出差，每次都要手动重填同样的同行人和预算上限……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 如果有具体想法就写出来；没有也可以，只写问题
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在你是怎么绕过去的？或者你试过哪些别的工具？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 你觉得这属于
      options:
        - 大屏可视化（地图 / 图表 / 3D）
        - 数据维护后台（录入 / 导入导出）
        - 账单与 AA 分摊
        - 协作与权限（团队 / 活动 / 角色）
        - AI 行程规划
        - 部署与运维
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: 参与意愿
      description: 只是想确认一下，不影响是否采纳
      options:
        - label: 我愿意自己提 PR 实现它
        - label: 我可以帮忙测试
